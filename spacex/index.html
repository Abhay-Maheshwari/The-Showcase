<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceX Design Showcase</title>
  <link rel="stylesheet" href="./spacex.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header>
    <div class="logo">SPACEX</div>
    <nav class="nav-links">
       <a href="#" class="nav-link">Falcon 9</a>
       <a href="#" class="nav-link">Falcon Heavy</a>
       <a href="#" class="nav-link">Dragon</a>
       <a href="#" class="nav-link">Starship</a>
       <a href="#" class="nav-link">Human Spaceflight</a>
       <a href="#" class="nav-link">Starlink</a>
    </nav>
    <div style="margin-left: auto;">
       <a href="#" class="nav-link">Shop</a>
    </div>
  </header>

  <main>
    <section class="viewport-section" style="background-image: url('https://images.unsplash.com/photo-1517976487492-5750f3195933?auto=format&fit=crop&q=80&w=2000');">
       <div class="section-overlay"></div>
       <div class="content-block">
          <h2 class="section-heading" style="margin-bottom: 8px;">Upcoming Launch</h2>
          <h1 class="hero-display" style="margin-bottom: 24px;">Starlink Mission</h1>
          <button class="btn">Watch</button>
       </div>
    </section>

    <section class="viewport-section" style="background-image: url('https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?auto=format&fit=crop&q=80&w=2000');">
       <div class="section-overlay"></div>
       <div class="content-block">
          <h2 class="section-heading" style="margin-bottom: 8px;">Starship</h2>
          <h1 class="hero-display" style="margin-bottom: 24px;">To the moon and mars</h1>
          <button class="btn">Learn More</button>
       </div>
    </section>

    <section class="viewport-section" style="background-image: url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&q=80&w=2000');">
       <div class="section-overlay"></div>
       <div class="content-block">
          <h2 class="section-heading" style="margin-bottom: 8px;">Dragon</h2>
          <h1 class="hero-display" style="margin-bottom: 24px;">Resupply to the ISS</h1>
          <button class="btn">Learn More</button>
       </div>
    </section>
  </main>

  <footer style="padding: 40px 0; text-align: center; background: black;">
     <div style="display: flex; justify-content: center; gap: 24px; font-size: 12px; color: var(--spectral-white); opacity: 0.8;">
        <span>SPACEX © 2024</span>
        <a href="#" class="nav-link" style="font-size: 12px;">X</a>
        <a href="#" class="nav-link" style="font-size: 12px;">YouTube</a>
        <a href="#" class="nav-link" style="font-size: 12px;">Instagram</a>
        <a href="#" class="nav-link" style="font-size: 12px;">Flickr</a>
        <a href="#" class="nav-link" style="font-size: 12px;">LinkedIn</a>
        <a href="#" class="nav-link" style="font-size: 12px;">Privacy Policy</a>
        <a href="#" class="nav-link" style="font-size: 12px;">Suppliers</a>
     </div>
  </footer>

  <script type="module" src="./spacex.js"></script>
</body>
</html>

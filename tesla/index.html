<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Design Showcase</title>
  <link rel="stylesheet" href="./tesla.css">
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="nav-container" id="main-nav">
    <div class="tesla-logo">TESLA</div>
    <div class="nav-center" style="display: flex; gap: 8px;">
      <a href="#" class="nav-item">Vehicles</a>
      <a href="#" class="nav-item">Energy</a>
      <a href="#" class="nav-item">Charging</a>
      <a href="#" class="nav-item">Discover</a>
      <a href="#" class="nav-item">Shop</a>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="#" class="nav-item">Help</a>
      <a href="#" class="nav-item">Account</a>
    </div>
  </nav>

  <main>
    <section class="hero-section">
      <img src="https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&q=80&w=2000" alt="Model 3" class="hero-img">
      <div class="section-content">
        <h1 class="hero-title" style="color: white; margin-bottom: 8px;">Model 3</h1>
        <p style="color: white; font-size: 14px; margin-bottom: 40vh;">Order Online for Touchless Delivery</p>
        <div style="display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;">
          <button class="btn btn-primary">Order Now</button>
          <button class="btn btn-secondary">View Inventory</button>
        </div>
      </div>
    </section>

    <section class="hero-section">
      <img src="https://images.unsplash.com/photo-1617788138017-80ad42243c59?auto=format&fit=crop&q=80&w=2000" alt="Model Y" class="hero-img">
      <div class="section-content">
        <h1 class="hero-title" style="color: white; margin-bottom: 8px;">Model Y</h1>
        <p style="color: white; font-size: 14px; margin-bottom: 40vh;">1.99% APR Available</p>
        <div style="display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;">
          <button class="btn btn-primary">Order Now</button>
          <button class="btn btn-secondary">Learn More</button>
        </div>
      </div>
    </section>

    <section style="padding: 100px 40px; background: white;">
       <div style="max-width: 1440px; margin: 0 auto;">
          <h2 style="font-size: 28px; font-weight: 500; margin-bottom: 40px;">Shop Accessories</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
             <div class="category-card">
                <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a?auto=format&fit=crop&q=80&w=1000" alt="Wall Connector">
                <div class="category-label">Charging</div>
             </div>
             <div class="category-card">
                <img src="https://images.unsplash.com/photo-1541443131876-44b03de101c5?auto=format&fit=crop&q=80&w=1000" alt="Apparel">
                <div class="category-label">Lifestyle</div>
             </div>
          </div>
       </div>
    </section>
  </main>

  <footer style="padding: 40px 0; text-align: center; background: white;">
    <div style="display: flex; justify-content: center; gap: 24px; font-size: 12px; color: var(--text-pewter);">
       <span>Tesla © 2024</span>
       <span>Privacy & Legal</span>
       <span>Vehicle Recalls</span>
       <span>Contact</span>
       <span>News</span>
       <span>Locations</span>
    </div>
  </footer>

  <script type="module" src="./tesla.js"></script>
</body>
</html>

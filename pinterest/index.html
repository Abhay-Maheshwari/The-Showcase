<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinterest Design Showcase</title>
    <link rel="stylesheet" href="./pinterest.css" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <a href="/" style="color: var(--pinterest-red); display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; transition: background-color 0.2s;">
        <svg height="24" width="24" viewBox="-3 -3 30 30" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.279 1.148c-.038.154-.127.189-.286.115-1.066-.497-1.733-2.059-1.733-3.318 0-2.698 1.959-5.176 5.649-5.176 2.97 0 5.279 2.115 5.279 4.942 0 2.951-1.859 5.326-4.444 5.326-1.045 0-2.029-.543-2.366-1.186l-.645 2.456c-.234.896-.867 2.016-1.293 2.699 1.018.314 2.093.483 3.208.483 6.627 0 12-5.373 12-12S18.627 0 12 0z"/>
        </svg>
      </a>
      <a href="#" class="btn btn-primary" style="padding: 12px 24px; color: white;">Home</a>
      <a href="#" class="nav-link" style="padding: 12px 16px;">Explore</a>
      <a href="#" class="nav-link" style="padding: 12px 16px;">Create</a>
      
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="input-search" placeholder="Search">
      </div>

      <div class="nav-links">
        <button class="theme-toggle btn-circle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto; display: block;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button class="btn-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin: 0 auto; display: block;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        </button>
      </div>
    </nav>

    <main>
      <div class="container" style="padding-top: 32px;">
        <div style="text-align: center; margin-bottom: 48px;">
          <h1 class="display-hero">Get your next</h1>
          <h1 class="display-hero" style="color: var(--green-700);">home decor idea</h1>
        </div>

        <!-- Masonry Grid -->
        <div class="masonry-grid">
          
          <!-- Pin 1 -->
          <div class="pin-card">
            <div class="pin-image" style="height: 300px; background-color: #d8e2dc;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <button class="btn-circle" style="background: rgba(255,255,255,0.8); width: 32px; height: 32px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto; display: block;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
                <button class="btn-circle" style="background: rgba(255,255,255,0.8); width: 32px; height: 32px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto; display: block;"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
              </div>
            </div>
            <div style="padding: 8px 4px;">
              <p class="body-text" style="font-weight: 600;">Cozy reading corner</p>
            </div>
          </div>

          <!-- Pin 2 -->
          <div class="pin-card">
            <div class="pin-image" style="height: 450px; background-color: #fec5bb;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
            </div>
          </div>

          <!-- Pin 3 -->
          <div class="pin-card">
            <div class="pin-image" style="height: 250px; background-color: #e2eafc;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
            </div>
          </div>

          <!-- Pin 4 -->
          <div class="pin-card">
            <div class="pin-image" style="height: 380px; background-color: #fae1dd;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
            </div>
            <div style="padding: 8px 4px;">
              <p class="body-text" style="font-weight: 600;">Minimalist living room</p>
            </div>
          </div>

          <!-- Pin 5 -->
          <div class="pin-card">
            <div class="pin-image" style="height: 280px; background-color: #ccd5ae;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
            </div>
          </div>

           <!-- Pin 6 -->
           <div class="pin-card">
            <div class="pin-image" style="height: 400px; background-color: #e9edc9;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
            </div>
          </div>

           <!-- Pin 7 -->
           <div class="pin-card">
            <div class="pin-image" style="height: 320px; background-color: #fefae0;"></div>
            <div class="pin-overlay">
              <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" style="padding: 12px 16px;">Save</button>
              </div>
            </div>
            <div style="padding: 8px 4px;">
              <p class="body-text" style="font-weight: 600;">Warm lighting</p>
            </div>
          </div>

        </div>
      </div>
    </main>

    <script type="module" src="./pinterest.js"></script>
  </body>
</html>
